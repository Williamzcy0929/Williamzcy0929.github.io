      category: Biomedical AI
      period: November 2025 – present
      start: 2025-11
      end: present
      status: Ongoing methodological research
      supervisor: Prof. Anru Zhang, Duke University
      institution: School of Medicine, Duke University
      featured: true
      summary: I develop Med2State, a Python/PyTorch deep learning model for structured
        patient-state representations from incomplete multimodal records and longitudinal
        clinical history.
      highlights:
        - Develop Med2State, a deep learning model in Python and PyTorch that learns structured
          patient-state representations from incomplete multimodal records and longitudinal
          clinical history, with separate disease, procedure, and treatment channels.
        - Build modular encoders for demographics, measurements, structured EHR events,
          text, and images. Explore semantic cross-attention, low-rank fusion, and temporal
          models for irregular visits.
        - Develop learning objectives and clinical concept readouts for incomplete longitudinal
          records.
    - slug: l-star
      title: "L-STAR: LLM-guided Spatial Domain Detection"
      description: Visual LLM-guided consensus spatial domain detection with Python
        LLM workflows and consensus clustering in R.
      category: Biomedical AI
      period: September 2025 – October 2026
      start: 2025-09
      end: 2026-10
      status: Published in Nature Communications (2026)
      supervisor: Prof. Zhicheng Ji, Duke University
      institution: Department of Biostatistics and Bioinformatics, Duke University
      url: https://github.com/Williamzcy0929/L-STAR
      featured: true
      summary: I developed L-STAR, combining Python LLM workflows for spatial-domain
        method selection with consensus clustering in R and spatial expression analysis
        using Seurat and SpatialExperiment.
      highlights:
        - Developed L-STAR, an LLM-guided spatial domain detection framework that achieved
          the highest average normalized ARI across evaluation datasets, outperforming
          individual methods and fixed-method consensus.
        - Designed structured prompts and implemented Python workflows to compare candidate
          domain maps using tissue context and optional histology.
        - Implemented repeated pairwise comparisons and win-rate ranking for method selection.
          Combined selected domain assignments through co-assignment matrices and consensus
          clustering in R.
        - Processed spatial expression data with Seurat and SpatialExperiment and built
          marker-guided domain annotation. Distinguished tissue regions from cell types
          by sampling level, retaining Unknown for insufficient evidence. Evaluated agreement
          using BioLORD-2023 embeddings and within-dataset permutation tests.
        - Benchmarked L-STAR across six spatial transcriptomics datasets against individual
          methods and fixed-method consensus. Assessed sensitivity to ensemble size, LLM
          choice, color palettes, and presentation order, and quantified selected-method
          redundancy.
    - slug: papereval
      title: PaperEval
      description: OpenReview pipelines, manuscript-assessment agents, and fine-tuned
        models for acceptance prediction and author-response grading.
      category: Methods & Research Infrastructure
      period: March – September 2025
      start: 2025-03
      end: 2025-09
      supervisor: Prof. Jie Ding, University of Minnesota
      institution: School of Statistics, University of Minnesota, Twin Cities
      url: https://github.com/Williamzcy0929/PaperEval
      summary: I built OpenReview data pipelines, fine-tuned acceptance-prediction and
        response-grading models, and used the fine-tuned grader to evaluate generated
        author responses.
      highlights:
        - Built resumable OpenReview pipelines using Selenium and asynchronous requests,
          with structured JSON storage for papers, reviews, scores, and responses. Extracted
          author contact information from PDFs with PyMuPDF to enrich submission metadata.
        - Prepared training data and fine-tuned GPT-4o for paper acceptance prediction.
          Evaluated predictions using progressively richer inputs comprising paper metadata,
          reviewer scores, and review text.
        - Developed LLM-based agents to assess figures and tables in the context of full
          manuscripts and suggest improvements to clarity, readability, and presentation.
        - Fine-tuned GPT-4o mini as an LLM-based grader to score and compare author responses.
          Constructed proxy scoring targets from acceptance levels using bounded Gaussian
          noise.
        - Trained a reply-generation model and used the fine-tuned grader to compare generated
          responses with author replies from accepted and rejected submissions.
