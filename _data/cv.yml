      summary: I engineered mentoring-match features and modeled match duration and
        closure with survival analysis, a causal Bayesian network, and a mixture-of-experts
        model.
      highlights:
        - Engineered features from sparse, high-dimensional numerical and text data for
          mentoring-match prediction, including embeddings, sentiment scores, and pairwise
          similarities.
        - Modeled match duration and closure using Cox proportional hazards regression
          and a causal Bayesian network.
        - Designed a mixture-of-experts model with regression, MLP, and Transformer experts
          for different feature types and a learned gating network. Compared it with random
          forest and XGBoost baselines.
