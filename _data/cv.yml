  research:
    - slug: trace
      title: "TRACE: Trajectory Inference via AI-guided Cross-view Evidence"
      description: LLM-guided trajectory inference for scRNA-seq, scATAC-seq, and spatial
        transcriptomics with Python, LangGraph, R/Seurat, and Signac.
      category: Biomedical AI
      period: January 2026 – present
      start: 2026-01
      end: present
      status: Manuscript in preparation
      featured: true
      summary: I develop TRACE, an LLM-guided trajectory inference agent and end-to-end
        Python/LangGraph package for scRNA-seq, scATAC-seq, and spatial transcriptomics
        analysis.
      highlights:
        - Develop TRACE, an LLM-guided trajectory inference agent that automatically identifies
          root states and achieves high agreement with reference trajectories across evaluated
          scRNA-seq, scATAC-seq, and spatial transcriptomics datasets.
        - Build <code>trace</code>, an end-to-end Python package using LangGraph to coordinate
          LLM reasoning with R analysis. Integrate Seurat preprocessing, dimensionality
          reduction, clustering, and marker analysis with Signac gene-activity estimation.
        - Design structured prompts and targeted molecular-evidence queries to reconcile
          UMAP and t-SNE views for cell-type annotation, lineage reconstruction, and root-state
          selection.
        - Develop spatial pseudotime inference using molecular evidence and spatial neighborhood
          graphs to distinguish repeated local processes. Estimate pseudotime from local
          root cells while retaining ambiguous assignments and partially resolved trajectories.
        - Design <code>pPOS</code> to jointly evaluate lineage membership and within-lineage
          ordering, using blockwise pair counting and inclusion-exclusion to avoid double-counting
          cell pairs shared across branches.
        - Benchmark TRACE against Monocle 3, Slingshot, and TSCAN. Investigate discrepancies
          in <code>dyneval</code>-based <code>F1branches</code> evaluation and reimplement
          the published definition over the full cell set, with diagnostics for cell coverage
          and branch recovery.
      publication_title: "TRACE: Trajectory Reasoning via AI-guided Cross-view Evidence"
      supervisor: Prof. Zhicheng Ji, Duke University
      institution: Department of Biostatistics and Bioinformatics, Duke University
