        representations from incomplete multimodal records and longitudinal clinical
        history.
      category: Biomedical AI
      period: November 2025 – present
      start: 2025-11
      end: present
      status: Ongoing methodological research
      supervisor: Prof. Anru Zhang, Duke University
      institution: School of Medicine, Duke University
      featured: true
      summary: I develop Med2State, a Python/PyTorch deep learning model for structured
        patient-state representations from incomplete multimodal records and longitudinal
        clinical history.
      highlights:
        - Develop Med2State, a Python/PyTorch deep learning model for structured patient-state
          representations from incomplete multimodal records, with separate disease, procedure,
          and treatment channels.
        - Build modular encoders for demographics, measurements, structured EHR events,
          text, and images. Explore semantic cross-attention and low-rank fusion to integrate
          available evidence.
        - Explore temporal models for irregular visits and develop learning objectives
          and clinical concept readouts for longitudinal patient-state representations.
    - slug: l-star
      title: "L-STAR: Visual LLM-Guided Spatial Domain Detection"
      description: Visual LLM-guided consensus spatial domain detection and the lstar
        Python package for method selection, consensus clustering, and domain annotation.
      category: Biomedical AI
      period: September 2025 – October 2026
      start: 2025-09
      end: 2026-10
      status: Published in Nature Communications (2026)
      supervisor: Prof. Zhicheng Ji, Duke University
      institution: Department of Biostatistics and Bioinformatics, Duke University
      url: https://github.com/Williamzcy0929/L-STAR
      featured: true
      summary: I developed L-STAR and its Python package lstar for visual LLM-guided
        method selection, consensus spatial domain detection, and marker-guided domain
        annotation.
      highlights:
        - Developed L-STAR, a visual LLM-guided spatial domain detection framework that
          achieved the highest average normalized ARI across six spatial transcriptomics
          datasets, outperforming individual methods and fixed-method consensus.
        - Built <code>lstar</code>, a Python package integrating spatial map visualization,
          LLM-guided method selection, consensus clustering, and biological domain annotation
          with Scanpy-based marker analysis.
        - Designed structured prompts for repeated pairwise comparison of domain maps
          using tissue context and optional histology. Implemented win-rate ranking and
          consensus clustering in R using co-assignment matrices.
        - Processed study datasets with Seurat and SpatialExperiment and developed marker-guided
          domain annotation, distinguishing tissue regions from cell types by sampling
          level and retaining <code>Unknown</code> for insufficient evidence. Evaluated
          annotation agreement using BioLORD-2023 embeddings and within-dataset permutation
          tests.
        - Assessed sensitivity to ensemble size, LLM choice, color palettes, and presentation
          order, and quantified redundancy among selected methods.
    - slug: papereval
      title: PaperEval
      description: OpenReview pipelines, manuscript-assessment agents, and fine-tuned
        models for acceptance prediction and author-response grading.
      category: Methods & Research Infrastructure
      period: March – September 2025
      start: 2025-03
      end: 2025-09
      supervisor: Prof. Jie Ding, University of Minnesota
      institution: School of Statistics, University of Minnesota, Twin Cities
      url: https://github.com/Williamzcy0929/PaperEval
      summary: I built OpenReview data pipelines, fine-tuned acceptance-prediction and
        response-grading models, and used the fine-tuned grader to evaluate generated
        author responses.
      highlights:
        - Built resumable OpenReview pipelines with Selenium, asynchronous requests, and
          structured JSON storage for papers, reviews, scores, and responses. Enriched
          submission metadata by extracting author contact information from PDFs with
          PyMuPDF.
        - Fine-tuned GPT-4o for paper acceptance prediction and evaluated performance
          with progressively richer inputs, from paper metadata to reviewer scores and
          review text.
        - Developed LLM-based agents to assess figures and tables in the context of full
          manuscripts and suggest improvements to clarity, readability, and presentation.
        - Fine-tuned GPT-4o mini as a grader for author responses, constructing proxy
          scoring targets from acceptance levels with bounded Gaussian noise.
        - Trained a reply-generation model and evaluated its responses against author
          replies from accepted and rejected submissions using the fine-tuned grader.
