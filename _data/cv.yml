  research:
    - slug: l-star
      title: L-STAR
      description: Visual LLM-guided consensus spatial domain detection.
      category: Biomedical AI
      period: September 2025 – present
      start: 2025-09
      end: present
      status: Accepted in principle at Nature Communications
      supervisor: Prof. Zhicheng Ji, Duke University
      institution: Duke University
      url: https://github.com/Williamzcy0929/L-STAR
      featured: true
      summary: I developed a workflow that uses visual LLM comparisons to select spatial
        domain detection methods and combine their clusterings into a consensus tissue
        partition.
      highlights:
        - Built structured prompts, repeated comparisons of spatial maps and optional
          histology, JSON logs, and win-rate-based method selection.
        - Implemented consensus clustering with co-assignment matrices and average linkage,
          plus an all-wise comparison mode that aggregates repeated rankings with one
          LLM call per repeat.
        - Designed experiments across six spatial transcriptomics datasets to separate
          the effects of method selection and clustering aggregation, including ensemble-size,
          alternative-LLM, and fixed-method baselines.
        - Built marker-gene-based annotation with spot- and cell-level labels and an Unknown
          option; evaluated agreement with manual annotations using BioLORD-2023 embeddings
          and within-dataset permutation tests.
        - Audited sensitivity to color palettes, presentation order, and redundant candidates
          through ranking agreement, selected-method overlap, and clustering stability.
    - slug: pseudotime-agent
      title: LLM-Guided Pseudotime Analysis
      description: Evidence-guided agents for cell-state trajectories and spatial pseudotime.
      category: Biomedical AI
      period: January 2026 – present
      start: 2026-01
      end: present
      status: Manuscript in preparation
      featured: true
      summary: I developed pseudotime-agent, an end-to-end Python package that coordinates
        R/Seurat analysis and LLM inference through LangGraph, from evidence generation
        to per-cell pseudotime estimation.
      highlights:
        - Designed parallel UMAP and t-SNE annotation branches, concurrent lineage-family
          adjudication, and cross-embedding trajectory fusion, using marker-gene and graph
          evidence to review uncertain relationships.
        - Extended the agent with spatial trajectory proposal, relation adjudication,
          ordering review, and comparison with nonspatial trajectories by combining tissue
          adjacency and molecular evidence.
        - Implemented expression-weighted shortest-path pseudotime for spatially separate
          instances of a shared process, with synthetic negative controls and perturbation
          tests for spatial dependence and ordering stability.
        - Added JSON schema validation, corrective LLM retries, resumable execution, provenance
          logging, expert-supplied annotations, and preprocessed Seurat inputs including
          scATAC-seq gene-activity data.
        - Designed and implemented bPOS, an exact branch-aware metric that jointly evaluates
          lineage membership and within-lineage ordering using scalable block processing
          and inclusion-exclusion counting.
        - Diagnosed a bug in dyneval-based F1branches evaluation; reimplemented its published
          Jaccard, recovery, relevance, and harmonic-mean definition over the full cell
          scope and added diagnostic comparisons.
        - Built reproducible comparisons with Monocle 3, Slingshot, and TSCAN and curated
          gold-standard, silver-standard, and synthetic trajectory benchmarks.
    - slug: med2state
      title: Med2State
      description: Structured patient-state representations from incomplete multimodal
        health records.
      category: Biomedical AI
      period: November 2025 – present
      start: 2025-11
      end: present
      status: Ongoing methodological research
      supervisor: Prof. Chuan Hong, Duke University
      institution: School of Medicine, Duke University
      url: https://github.com/Williamzcy0929/Med2Vec_Plus
      huggingface: https://huggingface.co/Williamzcy0929/Med2Vec_Plus
      featured: true
      summary: I am developing Med2State, a framework for learning structured patient-state
        representations from available multimodal clinical evidence and longitudinal
        history.
      highlights:
        - Designing configurable encoders and evidence fusion for demographics, vital
          signs, structured EHR events, text, and images, with explicit handling of available
          input sources.
        - Organizing each state representation into DX, PROC, and TREAT semantic channels
          for disease-related information, procedures, and treatment or medication exposure,
          using evidence available up to a defined time point.
        - Investigating learning from partial evidence and longitudinal context, with
          concept readouts and retrieval-based evaluation to test what information each
          channel retains.
        - The earlier prototype aligned BioClinicalBERT note embeddings with structured
          EHR events, fused them through multi-head cross-attention, and implemented a
          Med2Vec-compatible PyTorch model with component ablations.
